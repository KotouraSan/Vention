{{- if .Values.gateway.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "k8s-final.fullname" . }}-route
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ include "k8s-final.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: route

spec:
  parentRefs:
    - name: {{ include "k8s-final.fullname" . }}-gateway
{{- if .Values.gateway.tls.enabled }}
      sectionName: https
{{- else }}
      sectionName: http
{{- end }}

  hostnames:
    - "{{ .Values.gateway.hostname }}"

  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api

      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /

      backendRefs:
        - name: {{ include "k8s-final.fullname" . }}-backend
          port: {{ .Values.backend.service.port }}

    - matches:
        - path:
            type: PathPrefix
            value: /

      backendRefs:
        - name: {{ include "k8s-final.fullname" . }}-frontend
          port: {{ .Values.frontend.service.port }}
{{- end }}