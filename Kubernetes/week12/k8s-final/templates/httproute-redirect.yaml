{{- if .Values.gateway.enabled }}
{{- if .Values.gateway.tls.enabled }}
{{- if .Values.httpRedirect.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "k8s-final.fullname" . }}-http-redirect
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ include "k8s-final.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: redirect

spec:
  parentRefs:
    - name: {{ include "k8s-final.fullname" . }}-gateway
      sectionName: http

  hostnames:
    - "{{ .Values.gateway.hostname }}"

  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: {{ .Values.httpRedirect.statusCode }}
{{- end }}
{{- end }}
{{- end }}