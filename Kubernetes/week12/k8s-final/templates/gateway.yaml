{{- if .Values.gateway.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ include "k8s-final.fullname" . }}-gateway
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ include "k8s-final.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: gateway

spec:
  gatewayClassName: {{ .Values.gateway.className }}

  listeners:
    - name: http
      hostname: "{{ .Values.gateway.hostname }}"
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same

{{- if .Values.gateway.tls.enabled }}
    - name: https
      hostname: "{{ .Values.gateway.hostname }}"
      protocol: HTTPS
      port: 443
      tls:
        mode: Terminate
        certificateRefs:
          - group: ""
            kind: Secret
            name: {{ .Values.gateway.tls.existingSecret }}
      allowedRoutes:
        namespaces:
          from: Same
{{- end }}
{{- end }}