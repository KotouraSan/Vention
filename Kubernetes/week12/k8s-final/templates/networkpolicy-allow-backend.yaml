{{- if .Values.networkPolicy.enabled }}
{{- if .Values.backend.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "k8s-final.fullname" . }}-allow-backend
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ include "k8s-final.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: network-policy

spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ include "k8s-final.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: backend

  policyTypes:
    - Ingress
    - Egress

  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ include "k8s-final.name" . }}
              app.kubernetes.io/instance: {{ .Release.Name }}
              app.kubernetes.io/component: frontend

        - podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ include "k8s-final.name" . }}
              app.kubernetes.io/instance: {{ .Release.Name }}
              app.kubernetes.io/component: health-check

        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: "{{ .Values.networkPolicy.gatewayNamespace }}"

      ports:
        - protocol: TCP
          port: {{ .Values.backend.containerPort }}

  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ include "k8s-final.name" . }}
              app.kubernetes.io/instance: {{ .Release.Name }}
              app.kubernetes.io/component: postgresql

      ports:
        - protocol: TCP
          port: {{ .Values.postgresql.containerPort }}
{{- end }}
{{- end }}