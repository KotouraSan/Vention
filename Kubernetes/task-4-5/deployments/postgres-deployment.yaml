apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: lab-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          envFrom:
            - configMapRef:
                name: week6-config
            - secretRef:
                name: week6-secret
          ports:
            - name: postgres
              containerPort: 5432
          resources:
            limits:
              memory: "256Mi"
              cpu: "1.5"
            requests:
              memory: "128Mi"
              cpu: "1.0"
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 5
            periodSeconds: 10