<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AnyOps Full Stack</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: Arial, sans-serif;
        background: #f4f7f9;
        color: #17202a;
      }

      main {
        width: min(520px, calc(100% - 32px));
        padding: 24px;
        border: 1px solid #d7dee5;
        border-radius: 8px;
        background: #ffffff;
      }

      h1 {
        margin: 0 0 16px;
        font-size: 28px;
      }

      pre {
        min-height: 96px;
        margin: 0;
        padding: 16px;
        overflow: auto;
        border-radius: 6px;
        background: #101820;
        color: #d6f5e3;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>AnyOps Full Stack</h1>
      <pre id="result">Loading...</pre>
    </main>

    <script>
      async function loadMessage() {
        const result = document.getElementById("result");

        try {
          const response = await fetch("/api/hello");
          const data = await response.json();
          result.textContent = JSON.stringify(data, null, 2);
        } catch (error) {
          result.textContent = `Request failed: ${error.message}`;
        }
      }

      loadMessage();
    </script>
  </body>
</html>
