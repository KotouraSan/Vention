---
- name: Install ufw
  ansible.builtin.apt:
    name: ufw
    state: present

- name: UFW allow all ports and proto
  community.general.ufw:
    rule: allow
    port: "{{ item.port }}"
    proto: "{{ item.proto }}"
  loop: "{{ ufw_allowed_ports }}"

- name: Enable ufw
  community.general.ufw:
    state: enabled
