---
- name: Install ufw
  ansible.builtin.apt:
    name: ufw
    state: present

- name: UFW allow 80/tcp
  community.general.ufw:
    rule: allow
    port: 80
    proto: tcp

- name: UFW allow 22/tcp
  community.general.ufw:
    rule: allow
    port: 22
    proto: tcp

- name: UFW allow 443/tcp
  community.general.ufw:
    rule: allow
    port: 443
    proto: tcp

- name: Enable ufw
  community.general.ufw:
    state: enabled
